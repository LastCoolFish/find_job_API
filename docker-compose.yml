services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: find_job_postgres
      PORT: 5432
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: find_job_network
